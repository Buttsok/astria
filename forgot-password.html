<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | IWAKI Law Office</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page-body">

  <main class="auth-container">
    <div class="auth-card">
      
      <form id="form-forgot" class="auth-form active">
        <div class="form-header">
          <h2>Reset Password</h2>
          <p>Enter your email address and we'll send you a recovery link.</p>
        </div>

        <div class="input-group">
          <label for="forgot-email">Email Address</label>
          <input type="email" id="forgot-email" placeholder="name@example.com" required />
        </div>

        <button type="submit" class="btn-pill btn-primary-pill btn-full">Send Recovery Link</button>

        <div class="forgot-password" style="text-align: center; margin-top: 15px;">
          <a href="auth.html" class="forgot-pass" style="color: inherit; text-decoration: underline;">Back to Sign In</a>
        </div>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
