<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | IWAKI Law Office</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page-body">

  <main class="auth-container">
    <div class="auth-card">
      
      <form id="form-reset" class="auth-form active">
        <div class="form-header">
          <h2>Set New Password</h2>
          <p>Please enter your new secure password below.</p>
        </div>

        <div class="input-group">
          <label for="new-password">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="new-password" placeholder="Enter new password" required />
            <button type="button" class="btn-toggle-pass" onclick="togglePass('new-password', this)">Show</button>
          </div>
        </div>

        <button type="submit" class="btn-pill btn-primary-pill btn-full">Update Password</button>
      </form>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
