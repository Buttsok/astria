<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Files | IWAKI & Astria</title>
  <link rel="stylesheet" href="css/file_manager.css" />
</head>
<body class="admin-body">

  <!-- Main Grid Layout -->
  <div class="admin-layout">
    
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="sidebar-brand">
        <a href="client-dashboard.html" class="brand-wrapper">
          <div class="brand-primary">
            <span class="brand-title"><img src="assets/iwaki main logo.png" alt="IWAKI Law Office"></span>
          </div>
          <div class="brand-divider"></div>
          <div class="brand-secondary">
            <span class="brand-astria"><img src="assets/Astria logo.png" alt="Astria Logo"></span>
          </div>
        </a>
      </div>

      <nav class="admin-nav">
        <a href="client-dashboard.html" class="admin-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Dashboard
        </a>
        <a href="file-manager.html" class="admin-nav-item active">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          My Files
        </a>
        <a href="client-calendar.html" class="admin-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Calendar
        </a>
        <a href="client-messages.html" class="admin-nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          Messages
        </a>
      </nav>
    </aside>

    <!-- Main Content Panel -->
    <main class="admin-main">
      
      <!-- Top Bar: Search & Filter Controls -->
      <header class="admin-topbar">
        <div class="search-bar-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="file-search-input" placeholder="Search document name..." class="admin-search-input" />
        </div>

        <div class="filter-group">
          <select class="filter-dropdown" id="file-sort-select">
            <option value="az">Alphabetical: A to Z</option>
            <option value="za">Alphabetical: Z to A</option>
          </select>
        </div>
      </header>

      <!-- Dashboard Grid Body -->
      <div class="dashboard-body-grid">
          
          <div style="margin-top: 2rem;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
              <h3 style="font-size: 1.1rem; font-weight: 700; color: #222222;">Uploaded Documents</h3>
              <span id="file-count-badge" style="background: #E2DBD0; color: #333; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;">0 Files</span>
            </div>

            <!-- Files Container -->
            <div id="client-files-container">
              <div class="logs-empty-state" style="background: #FFFFFF; border: 1.5px solid #58B673; border-radius: 20px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <p class="empty-title">No Files Available</p>
                <p class="empty-subtitle">Documents uploaded by your legal counsel will appear here automatically.</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Supabase & Client Files Loader Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://cyssvluzwzsftsskveet.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Use your working anon key here
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allClientFiles = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Guard route: Ensure client is signed in
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session) {
        window.location.href = 'auth.html';
        return;
      }

      // 2. Load client's files using their email as folder identifier
      await loadMyFiles(session.user.email);

      // Setup search and sort listeners
      document.getElementById('file-search-input')?.addEventListener('input', renderFiles);
      document.getElementById('file-sort-select')?.addEventListener('change', renderFiles);
    });

    async function loadMyFiles(clientEmail) {
      const container = document.getElementById('client-files-container');
      const countBadge = document.getElementById('file-count-badge');

      try {
        const { data: files, error } = await supabase.storage
          .from('client-documents')
          .list(clientEmail + '/');

        if (error) throw error;

        allClientFiles = files ? files.filter(f => f.name !== '.emptyFolderPlaceholder') : [];
        renderFiles();

      } catch (err) {
        container.innerHTML = `<p style="color: #ef4444; text-align: center; padding: 20px;">Error loading files: ${err.message}</p>`;
      }
    }

    function renderFiles() {
      const container = document.getElementById('client-files-container');
      const countBadge = document.getElementById('file-count-badge');
      const searchVal = (document.getElementById('file-search-input')?.value || '').toLowerCase();
      const sortVal = document.getElementById('file-sort-select')?.value || 'az';

      let filtered = allClientFiles.filter(f => {
        const displayName = f.name.includes('_') ? f.name.substring(f.name.indexOf('_') + 1) : f.name;
        return displayName.toLowerCase().includes(searchVal);
      });

      filtered.sort((a, b) => {
        const nameA = (a.name.includes('_') ? a.name.substring(a.name.indexOf('_') + 1) : a.name).toLowerCase();
        const nameB = (b.name.includes('_') ? b.name.substring(b.name.indexOf('_') + 1) : b.name).toLowerCase();
        return sortVal === 'az' ? nameA.localeCompare(nameB) : nameB.localeCompare(nameA);
      });

      if (countBadge) countBadge.textContent = `${filtered.length} Files`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="logs-empty-state" style="background: #FFFFFF; border: 1.5px solid #58B673; border-radius: 20px;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <p class="empty-title">No Files Available</p>
            <p class="empty-subtitle">Documents uploaded by your legal counsel will appear here automatically.</p>
          </div>
        `;
        return;
      }

      // Get user session email to form public URLs
      supabase.auth.getSession().then(({ data: { session } }) => {
        const clientEmail = session?.user?.email || '';

        container.innerHTML = `
          <div class="file-grid">
            ${filtered.map(file => {
              const ext = file.name.split('.').pop().toUpperCase();
              const displayName = file.name.includes('_') ? file.name.substring(file.name.indexOf('_') + 1) : file.name;
              const uploadDate = new Date(file.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
              
              const { data: urlData } = supabase.storage
                .from('client-documents')
                .getPublicUrl(`${clientEmail}/${file.name}`);

              return `
                <div class="file-card">
                  <div class="file-icon">${ext}</div>
                  <div class="file-name" title="${displayName}">${displayName}</div>
                  <div class="file-date">Uploaded: ${uploadDate}</div>
                  <a href="${urlData.publicUrl}" target="_blank" download class="btn-download">Download</a>
                </div>
              `;
            }).join('')}
          </div>
        `;
      });
    }
  </script>
</body>
</html>
